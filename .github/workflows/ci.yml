name: CI

# Runs Captain Shipit's gate (tests/gate.sh): the same suites, in the same order,
# as a local run. A suite added to the gate is in CI automatically.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Parser, scanner and database tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the secret scan reads the full history
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pip-audit
          sudo apt-get update && sudo apt-get install -y postgresql
      - name: Lints, unit tests and dependency audit
        run: bash tests/gate.sh unit
      - name: Database tests (schema, RLS between users, money math, races)
        run: bash tests/gate.sh sql

  smoke:
    name: Browser smoke test (demo mode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Build import sample fixtures
        run: python3 tools/make_import_samples.py
      - name: Every browser suite, phone to desktop, day and night
        run: bash tests/gate.sh ui
