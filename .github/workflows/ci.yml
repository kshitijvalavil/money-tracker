name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Parser, scanner and database tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql
      - name: Parser tests
        run: python3 tests/test_parsers.py
      - name: Scanner tests
        run: python3 tests/test_scanner.py
      - name: Scanner adversarial tests
        run: python3 tests/test_scanner_adversarial.py
      - name: Recurring bills tests
        run: python3 tests/test_recurring.py
      - name: Bill reader tests
        run: python3 tests/billreader_test.py
      - name: Bill-text (free OCR) parser tests
        run: python3 tests/billtext_test.py
      - name: Security hardening tests
        run: python3 tests/security_test.py
      - name: Scanner dry run on fixtures
        run: python3 -m bot.scanner --from-dir tests/fixtures
      - name: Database tests (schema, RLS, money math)
        run: bash tests/run.sh
      - name: Sprint 2 release gate (dates, races, RLS, detection)
        run: bash tests/sprint2_adversarial.sh

  smoke:
    name: Browser smoke test (demo mode)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Start app in demo mode
        run: |
          DEMO_MODE=1 nohup gunicorn app:app --bind 127.0.0.1:8099 > gunicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8099/ && exit 0
            sleep 1
          done
          echo "app did not start"; cat gunicorn.log; exit 1
      - name: Smoke test
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/smoke_test.py
      - name: Imports page tests
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/imports_ui_test.py
      - name: Bills page tests
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/bills_ui_test.py
      - name: Sprint 2 adversarial UI tests
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/sprint2_adversarial_ui.py
      - name: Sprint 3 goals / labels / insights UI tests
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/sprint3_ui_test.py
      - name: Sprint 4 PWA + mobile tests
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/sprint4_pwa_test.py
      - name: Sprint 5 snap-a-bill capture tests
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/sprint5_capture_test.py
      - name: Sprint 6 investments UI tests
        env:
          BASE_URL: http://127.0.0.1:8099
        run: python tests/investments_ui_test.py
      - name: Server log
        if: always()
        run: cat gunicorn.log || true
