# Render Blueprint — deploy with one click from the Render dashboard
# (New → Blueprint → pick this repo). You still set the two Supabase values
# below in the Render UI; they are marked sync:false so they are never stored
# in this file.
services:
  - type: web
    name: money-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # For "Snap a bill": the server reads a bill photo with Claude's vision
      # model. Set this in the Render UI; until then the feature returns a
      # friendly "not switched on yet" message. BILL_MODEL is optional.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BILL_MODEL
        sync: false
