# Render Blueprint — deploy with one click from the Render dashboard
# (New → Blueprint → pick this repo). You still set the two Supabase values
# below in the Render UI; they are marked sync:false so they are never stored
# in this file.
services:
  - type: web
    name: money-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT   # workers, threads and timeout: gunicorn.conf.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Where people can send privacy questions and complaints. Shown on the privacy
      # notice and in security.txt. Leave unset to show no email address.
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      # Switches on the Ask assistant, and reading bill photos and scanned
      # statements with Claude. Set it in the Render UI; until then those give a
      # friendly "not switched on yet" message and Ask gives basic answers.
      - key: ANTHROPIC_API_KEY
        sync: false
