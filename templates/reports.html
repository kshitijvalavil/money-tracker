{% extends "_shell.html" %}
{% block title %}Reports — Money Tracker{% endblock %}
{% block head %}
<script src="{{ url_for('static', filename='vendor/chart.umd.js') }}"></script>
{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Reports</h1>
  <div class="row" style="margin:0">
    <input type="month" id="month" style="width:auto">
    <button class="btn ghost" id="export">⬇ Export CSV</button>
  </div>
</div>

<div class="grid cols-2">
  <div class="card">
    <h2>Spending by category</h2>
    <div id="pieWrap"><canvas id="pie" height="260"></canvas></div>
  </div>
  <div class="card">
    <h2>Income vs. expenses (last 12 months)</h2>
    <canvas id="bars" height="260"></canvas>
  </div>
</div>
{% endblock %}

{% block page_script %}
<script type="module">
  import { db, money, esc, thisMonth, toast } from "{{ url_for('static', filename='js/app.js') }}";
  const $ = (id) => document.getElementById(id);
  $("month").value = thisMonth();

  // A calm, readable categorical palette.
  const PALETTE = ["#2f5fe0", "#17a2b8", "#27ae60", "#e1a200", "#e4572e",
                   "#8e44ad", "#d81b60", "#00897b", "#5c6bc0", "#789262"];
  let pie, bars;

  async function loadPie() {
    const month = $("month").value || thisMonth();
    const { data, error } = await db.rpc("spending_by_category", { p_month: month });
    if (error) return toast(error.message);

    if (pie) pie.destroy();
    if (!data.length) {
      $("pieWrap").innerHTML = `<div class="empty">No expenses this month.</div>`;
      return;
    }
    $("pieWrap").innerHTML = `<canvas id="pie" height="260"></canvas>`;
    pie = new Chart($("pie"), {
      type: "doughnut",
      data: {
        labels: data.map((d) => d.category),
        datasets: [{ data: data.map((d) => Number(d.total)),
                     backgroundColor: data.map((_, i) => PALETTE[i % PALETTE.length]),
                     borderWidth: 2, borderColor: "#fff" }],
      },
      options: {
        plugins: {
          legend: { position: "bottom", labels: { padding: 14, font: { size: 12 } } },
          tooltip: { callbacks: { label: (c) => ` ${c.label}: ${money(c.parsed)}` } },
        },
        cutout: "62%",
      },
    });
  }

  async function loadBars() {
    const { data, error } = await db.rpc("monthly_totals");
    if (error) return toast(error.message);
    if (bars) bars.destroy();
    bars = new Chart($("bars"), {
      type: "bar",
      data: {
        labels: data.map((d) => d.month),
        datasets: [
          { label: "Income",  data: data.map((d) => Number(d.income)),  backgroundColor: "#27ae60", borderRadius: 4 },
          { label: "Expenses", data: data.map((d) => Number(d.expense)), backgroundColor: "#e4572e", borderRadius: 4 },
        ],
      },
      options: {
        plugins: {
          legend: { position: "bottom" },
          tooltip: { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.parsed.y)}` } },
        },
        scales: { y: { ticks: { callback: (v) => "₹" + v.toLocaleString("en-IN") } } },
      },
    });
  }

  // Export every transaction as a CSV file the user can open in Excel.
  async function exportCsv() {
    const { data, error } = await db.from("transactions")
      .select("occurred_on, type, amount, note, categories(name), " +
              "from_acc:accounts!transactions_account_id_fkey(name), " +
              "to_acc:accounts!transactions_to_account_id_fkey(name)")
      .order("occurred_on", { ascending: false });
    if (error) return toast(error.message);
    if (!data.length) return toast("Nothing to export yet.");

    const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const header = ["Date", "Type", "Category", "Account", "To account", "Note", "Amount"];
    const rows = data.map((t) => [
      t.occurred_on, t.type, t.categories?.name || "", t.from_acc?.name || "",
      t.to_acc?.name || "", t.note, Number(t.amount).toFixed(2),
    ].map(cell).join(","));
    const csv = [header.map(cell).join(","), ...rows].join("\r\n");

    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url; a.download = `transactions-${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
  }

  $("month").addEventListener("change", loadPie);
  $("export").addEventListener("click", exportCsv);
  if (db) { loadPie(); loadBars(); }
</script>
{% endblock %}
