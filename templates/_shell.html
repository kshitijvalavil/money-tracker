{% extends "base.html" %}
{# Signed-in shell: sidebar nav + content area. Pages extend this. #}
{% block body %}
<div class="app">
  <aside class="sidebar">
    <div class="brand">💰 Money<span>Tracker</span></div>
    <nav class="nav">
      <a href="/"             class="{{ 'active' if page=='dashboard' }}"><span class="ico">🏠</span> Dashboard</a>
      <a href="/transactions" class="{{ 'active' if page=='transactions' }}"><span class="ico">↕️</span> Transactions</a>
      <a href="/accounts"     class="{{ 'active' if page=='accounts' }}"><span class="ico">🏦</span> Accounts</a>
      <a href="/budgets"      class="{{ 'active' if page=='budgets' }}"><span class="ico">🎯</span> Budgets</a>
      <a href="/reports"      class="{{ 'active' if page=='reports' }}"><span class="ico">📊</span> Reports</a>
    </nav>
    <div class="bottom">
      <button class="theme-toggle" id="themeToggle"><span class="ico" id="themeIcon">🌙</span> <span id="themeLabel">Night mode</span></button>
      <div class="user-email" id="userEmail"></div>
      <button class="signout" id="signout">Sign out</button>
    </div>
  </aside>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script type="module">
  import { requireAuth, signOut, initThemeToggle } from "{{ url_for('static', filename='js/app.js') }}";
  initThemeToggle(document.getElementById("themeToggle"),
                  document.getElementById("themeIcon"),
                  document.getElementById("themeLabel"));
  const user = await requireAuth();
  if (user) document.getElementById("userEmail").textContent = user.email;
  document.getElementById("signout").onclick = signOut;
</script>
{% block page_script %}{% endblock %}
{% endblock %}
